{% load static tailwind_tags %}{% tailwind_css %}
<title>Confirm Email</title>
<div>
    <h2>Confirm Your Email</h2>
    <p>Enter the 4-digit code that was sent to your e-mail address</p>
    <form>
        {% csrf_token %}
        {{form.as_div}}
        <button type="submit">
            Submit
        </button>
    </form>
</div>
