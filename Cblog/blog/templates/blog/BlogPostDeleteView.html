{% extends 'base.html' %}{% block content %}
<h2 class="text-2xl font-bold mb-4">Delete Blog Post</h2>
<form method="POST" class="space-y-4 bg-white container-md">
  {% csrf_token %}
  <p>
    Are you sure you want to delete the blog post "{{ posts.title }}"?
  </p>
  <button
    type="submit"
    class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
  >
    Confirm Delete
  </button>
  <a
    href="{% url 'blog:posts'  %}"
    class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
  >
    Cancel
  </a>
  {%endblock%}
</form>
