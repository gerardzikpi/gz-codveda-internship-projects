{% extends "base.html" %} {% block title %}Create new Blog Post | Community
Hub{% endblock title %} {% block content %}
<div
  class="bg-blue-50 container-md shadow-lg p-6 rounded-lg border-gray-500 rounded-xl"
>
  <h2 class="text-2xl font-bold mb-4">Create new Blog Post</h2>

  <form action="" method="post">
    {% csrf_token %}
    {{form.as_div}}
  
    <button
      type="submit"
      value="{{form.save}}"
      class="bg-blue-500 text-white px-4 py-2 rounded items-end justify-end hover:bg-blue-600"
    >
      Create blog Post
    </button>
  </form>
</div>

{% endblock content %}
