{% extends 'base.html' %} {% block title %}Update Post{% endblock %}
<p>{% block content %}</p>
<div
  class="bg-blue-50 container-md shadow-lg p-6 rounded-lg border-gray-500 rounded-xl"
>
  <h2 class="text-2xl font-bold mb-4">Update Blog Post</h2>
  <form
    action="{%url 'update' posts.id%}"
    method="post"
    class="space-y-4 bg-white container-md"
  >
    {% csrf_token %} {{form.as_div}}

    <button
      type="submit"
      class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
    >
      Update Blog Post
    </button>
  </form>
</div>
{% endblock %}
